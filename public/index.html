<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Chat Tester — Static Users</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    :root {
      /* Modern Dark Theme */
      --bg: #0f172a;           /* slate-900 */
      --panel: #1e293b;        /* slate-800 */
      --panel-hover: #334155;  /* slate-700 */
      --muted: #94a3b8;        /* slate-400 */
      --fg: #f8fafc;           /* slate-50 */
      --accent: #3b82f6;       /* blue-500 */
      --accent-hover: #2563eb; /* blue-600 */
      --success: #10b981;      /* emerald-500 */
      --border: #334155;       /* slate-700 */
      --chip: #0f172a;         /* slate-900 */
      --danger: #ef4444;       /* red-500 */
      --msg-mine: #164e63;     /* cyan-900 */
      --msg-other: #1e293b;    /* slate-800 */
    }
    
    * { box-sizing: border-box; }
    
    body { 
      margin: 0; 
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; 
      background: var(--bg); 
      color: var(--fg); 
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Header */
    header { 
      padding: 16px 24px; 
      background: var(--panel);
      border-bottom: 1px solid var(--border); 
      display: flex; 
      gap: 16px; 
      align-items: center; 
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      z-index: 10;
    }
    
    header .brand { font-weight: 700; font-size: 1.1rem; color: var(--fg); margin-right: auto; }
    
    input, select, button {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 10px 14px; 
      background: var(--chip); 
      color: var(--fg); 
      border: 1px solid var(--border); 
      border-radius: 8px; 
      outline: none;
      transition: all 0.2s ease;
    }
    
    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
    }
    
    button { 
      cursor: pointer; 
      font-weight: 500; 
      background: var(--panel-hover);
    }
    
    button:hover { background: var(--border); }
    
    button.primary { background: var(--accent); color: white; border-color: var(--accent); }
    button.primary:hover { background: var(--accent-hover); }
    
    header .status {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      background: rgba(239, 68, 68, 0.2);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    header .status.connected {
      background: rgba(16, 185, 129, 0.2);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.3);
    }

    /* Main Grid */
    main { 
      display: grid; 
      grid-template-columns: 380px 1fr 380px; 
      gap: 16px; 
      padding: 20px; 
      flex: 1;
      height: calc(100vh - 70px);
      overflow: hidden;
    }
    
    section { 
      background: var(--panel); 
      border: 1px solid var(--border); 
      border-radius: 12px; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    section h3 { 
      margin: 0; 
      padding: 14px 20px; 
      border-bottom: 1px solid var(--border); 
      color: var(--fg); 
      font-weight: 600; 
      font-size: 0.95rem;
      background: rgba(15, 23, 42, 0.4);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .content { padding: 16px; display: flex; flex-direction: column; gap: 16px; flex: 1; overflow-y: auto; }
    
    .row { display: flex; flex-direction: column; gap: 6px; }
    .row.horizontal { flex-direction: row; align-items: flex-end; }
    .row label { color: var(--muted); font-size: 0.8rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .hr { height: 1px; background: var(--border); margin: 8px 0; }
    
    /* Pills */
    .flex-wrap { display: flex; gap: 8px; flex-wrap: wrap; }
    .pill {
      display: inline-flex;  align-items: center; justify-content: center;
      padding: 8px 16px;
      border: 1px solid var(--border); border-radius: 999px; background: var(--bg);
      cursor: pointer; color: var(--fg); font-weight: 500; font-size: 0.9rem;
      transition: all 0.2s ease;
    }
    .pill:hover { background: var(--panel-hover); }
    .pill.active { background: var(--accent); border-color: var(--accent); color: white; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); }

    /* Rooms section */
    .rooms-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 150px; }
    .room { 
      border: 1px solid var(--border); border-radius: 10px; padding: 12px; 
      background: var(--bg); cursor: pointer; transition: all 0.2s ease; 
    }
    .room:hover { border-color: var(--muted); }
    .room.active { border-color: var(--accent); background: rgba(59, 130, 246, 0.1); }
    .room .name { font-weight: 600; font-size: 0.95rem; margin-bottom: 4px; }
    .room .id { color: var(--muted); font-size: 0.75rem; font-family: monospace; }
    
    /* Chat Area */
    .chat-container { display: flex; flex-direction: column; height: 100%; }
    .messages { 
      flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; 
      background: var(--bg); scroll-behavior: smooth;
    }
    
    .msg { 
      max-width: 85%; padding: 12px 16px; border-radius: 16px; position: relative;
      background: var(--msg-other); border: 1px solid var(--border); border-bottom-left-radius: 4px;
      align-self: flex-start;
    }
    .msg.mine { 
      background: var(--msg-mine); border-color: #0891b2; border-bottom-left-radius: 16px; border-bottom-right-radius: 4px;
      align-self: flex-end;
    }
    
    .msg .meta { 
      font-size: 0.75rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; 
    }
    .msg.mine .meta { flex-direction: row-reverse; }
    
    .msg .mid { color: var(--accent); font-family: monospace; font-size: 0.7rem; }
    .msg .body { font-size: 0.95rem; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
    
    .msg .readpill { 
      padding: 2px 8px; font-size: 0.7rem; border-radius: 999px; background: rgba(255,255,255,0.1); border: none; margin-left: auto;
    }
    
    /* Typing Indicator */
    .typing-container {
      padding: 8px 20px;
      background: var(--bg);
      font-size: 0.8rem;
      color: var(--accent);
      min-height: 36px;
      display: flex;
      align-items: center;
      font-style: italic;
      border-top: 1px solid var(--border);
    }
    
    .typing-indicator span {
      display: inline-block;
      width: 4px; height: 4px; background-color: var(--accent);
      border-radius: 50%; margin-left: 2px;
      animation: bounce 1.4s infinite ease-in-out both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Input Area */
    .input-area { padding: 16px; background: var(--panel); border-top: 1px solid var(--border); display: flex; gap: 10px; }
    .input-area input { flex: 1; padding: 12px 16px; border-radius: 999px; background: var(--bg); }
    .input-area button { padding: 12px 24px; border-radius: 999px; font-weight: 600; }

    /* Event Logs */
    .logs { 
      flex: 1; overflow-y: auto; padding: 12px; font-family: monospace; font-size: 0.8rem;
      background: #020617; /* Very dark blue for logs */
    }
    .log-line { margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.05); word-break: break-all; }
    .log-time { color: var(--muted); margin-right: 8px; }
    .log-ev { color: #60a5fa; }
    .log-emit { color: #34d399; }
    .log-err { color: #f87171; }
    .log-sys { color: #fbbf24; }
    
    /* Drawer Styling */
    .drawer-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 1000;
      display: none; opacity: 0; transition: opacity 0.3s ease;
    }
    .drawer-overlay.open { display: block; opacity: 1; }
    .drawer {
      position: fixed; top: 0; left: -400px; bottom: 0; width: 380px;
      background: var(--bg); z-index: 1001;
      border-right: 1px solid var(--border);
      box-shadow: 4px 0 15px rgba(0,0,0,0.5);
      transition: left 0.3s ease;
      display: flex; flex-direction: column;
    }
    .drawer.open { left: 0; }
    .drawer h3 {
      margin: 0; padding: 14px 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; background: var(--panel);
    }
    .drawer .close-btn { background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; padding: 0; }
    .drawer .close-btn:hover { color: white; }

    /* Scrollbar Styling */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--panel-hover); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  </style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center; gap:12px;">
    <button id="btnOpenConfig" style="background:transparent; border:none; font-size:1.5rem; cursor:pointer; color:var(--fg);" title="Identity & Setup">&#9776;</button>
    <div class="brand">💬 Chat Tester</div>
  </div>
  <input id="serverUrl" value="http://localhost:8080" style="min-width:280px" placeholder="Server URL" />
  <button id="btnConnect" class="primary">Connect</button>
  <div id="status" class="status">Disconnected</div>
</header>

<div class="drawer-overlay" id="drawerOverlay"></div>
<div class="drawer" id="configDrawer">
  <h3>Identity & Setup <button class="close-btn" id="btnCloseConfig">&times;</button></h3>
  <div class="content">
      <div class="row">
        <label>Select Identity</label>
        <div class="flex-wrap" id="userPills"></div>
        <div class="row horizontal" style="margin-top: 6px; gap: 8px;">
          <input id="newUserName" placeholder="Name" style="flex: 1; min-width: 60px; font-size: 0.8rem; padding: 6px 10px;" />
          <input id="newUserRowId" placeholder="UUID (optional)" style="flex: 2; font-size: 0.8rem; padding: 6px 10px;" />
          <button id="btnAddUser" class="primary" style="padding: 6px 14px; font-size: 0.8rem; width: auto;">Add</button>
        </div>
      </div>

      <div class="row horizontal">
        <div class="row" style="flex:1">
          <label>Your row_id</label>
          <input id="rowId" />
        </div>
        <button id="btnResetIds" title="Reset IDs to defaults">Reset</button>
      </div>

      <div class="row">
        <label>Project ID</label>
        <input id="projectId" value="aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa" />
      </div>

      <div class="grid2">
        <button id="btnConnected" title="Re-identify / re-send connected">Identify (Init)</button>
        <button id="btnRoomsList">Pull Rooms</button>
      </div>

      <div class="hr"></div>

      <div class="row">
        <label>Create Direct Message (DM)</label>
        <div class="row horizontal">
          <select id="peerSelect" style="flex:1"></select>
          <button id="btnCreateDM" class="primary">Create DM</button>
        </div>
        <div id="customPeerFields" style="display:none; flex-direction:column; gap:6px; margin-top:6px;">
          <input id="customPeerName" placeholder="Custom Peer Name" />
          <input id="customPeerId" placeholder="Custom Peer Row ID (UUID)" />
        </div>
      </div>

      <div class="row">
        <label>Create Static Group</label>
        <button id="btnCreateStaticGroup">Create Group</button>
      </div>

      <div class="row">
        <label>Join Room Manually</label>
        <div class="row horizontal">
          <input id="joinRoomId" placeholder="Enter room UUID" style="flex:1" />
          <button id="btnJoinRoom">Join</button>
        </div>
      </div>
  </div>
</div>

<main>
  <!-- Left Column: Rooms -->
  <section>
    <h3>Available Rooms</h3>
    <div class="content" style="padding:16px; flex:1;">
      <div class="rooms-list" id="roomsList" style="flex:1; margin-top:0;">
        <div style="color:var(--muted); font-size:0.85rem; padding:10px;">No rooms loaded yet.</div>
      </div>
    </div>
  </section>

  <!-- Middle Column: Chat -->
  <section>
    <h3>
      Chat Window
      <span id="activeRoomLabel" style="font-weight:400; font-size:0.8rem; color:var(--muted);">Select a room</span>
    </h3>
    
    <div class="chat-container">
      <div class="messages" id="messages">
        <!-- Messages go here -->
         <div style="text-align:center; color:var(--muted); margin-top:50px; font-size:0.9rem;">
           Join a room to start messaging
         </div>
      </div>
      
      <!-- Typing Indicator Area -->
      <div class="typing-container">
        <div id="typingIndicator" style="display:none;">
           <span id="typingUser">Someone</span> is typing
           <span class="typing-indicator"><span></span><span></span><span></span></span>
        </div>
      </div>

      <div class="input-area">
        <input id="msgInput" placeholder="Type a message..." autocomplete="off" disabled />
        <button id="btnSendMsg" class="primary" disabled>Send</button>
      </div>
      
      <div class="row horizontal" style="padding: 0 16px 16px 16px; background: var(--panel);">
         <input id="manualMsgId" placeholder="Message ID to mark as read" style="flex:1; font-size:0.8rem; padding:8px 12px; border-radius:6px;" />
         <button id="btnMarkRead" style="font-size:0.8rem; padding:8px 12px; border-radius:6px;">Mark Read</button>
      </div>
    </div>
  </section>

  <!-- Right Column: Event Log -->
  <section>
    <h3>Event Logs <button onclick="document.getElementById('logs').innerHTML=''" style="padding:4px 8px; font-size:0.7rem;">Clear</button></h3>
    <div class="logs" id="logs"></div>
  </section>
</main>

<script>
  // ---------- Helpers ----------
  const el = (id) => document.getElementById(id);
  const logs = el('logs');

  function log(kind, title, payload) {
    const line = document.createElement('div');
    line.className = 'log-line';
    const ts = new Date().toLocaleTimeString();
    
    let colorClass = '';
    if(kind === 'ev') colorClass = 'log-ev';
    else if(kind === 'emit') colorClass = 'log-emit';
    else if(kind === 'err') colorClass = 'log-err';
    else if(kind === 'sys') colorClass = 'log-sys';

    const body = payload !== undefined ? (typeof payload === 'string' ? payload : JSON.stringify(payload, null, 2)) : '';
    
    line.innerHTML = `<span class="log-time">[${ts}]</span> <span class="${colorClass}">${title}</span> ${body ? `<br><span style="color:#94a3b8">${body}</span>` : ''}`;
    logs.appendChild(line);
    logs.scrollTop = logs.scrollHeight;
  }

  // ---------- Users (STATIC UUIDs) ----------
  const STATIC_IDS = {
    Athos:   '11111111-1111-1111-1111-111111111111',
    Porthos: '22222222-2222-2222-2222-222222222222',
    Aramis:  '33333333-3333-3333-3333-333333333333',
  };

  const users = {
    Athos:   { name: 'Athos',   row_id: STATIC_IDS.Athos },
    Porthos: { name: 'Porthos', row_id: STATIC_IDS.Porthos },
    Aramis:  { name: 'Aramis',  row_id: STATIC_IDS.Aramis },
  };

  let activeUser = 'Athos';
  let socket = null;
  let heartbeatTimer = null;

  // Client State
  const state = {
    rooms: new Map(),          // room_id -> room
    currentRoomId: null,
    messages: new Map(),       // room_id -> [messages]
    readSent: new Set(),       // message_ids already emitted
    typingUsers: new Set(),    // Usernames currently typing
  };

  // ---------- Socket Connection ----------
  function connect() {
    const url = el('serverUrl').value || 'http://localhost:8080';
    if (socket?.connected) socket.disconnect();
    
    socket = io(url, {
      transports: ['websocket'],
      reconnection: true,
      reconnectionDelay: 500,
      reconnectionAttempts: Infinity
    });

    socket.on('connect', () => {
      log('sys', 'Socket connected', { id: socket.id });
      const statusEl = el('status');
      statusEl.textContent = 'Connected';
      statusEl.className = 'status connected';
      
      // Auto-identify right away
      doConnected();
    });

    socket.on('disconnect', (reason) => {
      log('sys', 'Socket disconnected', { reason });
      const statusEl = el('status');
      statusEl.textContent = 'Disconnected';
      statusEl.className = 'status';
      clearInterval(heartbeatTimer);
      heartbeatTimer = null;
    });

    // Server Events
    socket.on('rooms list', (rooms) => {
      log('ev', '⬅️ rooms list', rooms);
      renderRooms(rooms || []);
    });
    
    socket.on('room history', (msgs) => {
      log('ev', '⬅️ room history', msgs);
      const rid = state.currentRoomId;
      if (!rid) return;
      state.messages.set(rid, Array.isArray(msgs) ? msgs : []);
      renderMessages();
      markAllVisibleAsRead();
    });
    
    socket.on('chat message', (msg) => {
      log('ev', '⬅️ chat message', msg);
      const rid = msg?.room_id || msg?.RoomId;
      
      // If the sender just sent a message, they stopped typing
      const sender = msg?.from || msg?.From;
      if (sender && rid === state.currentRoomId) {
         handleTypingEvent({ user_name: sender, room_id: rid }, false);
      }

      if (!rid) return;
      
      const arr = state.messages.get(rid) || [];
      arr.push(msg);
      state.messages.set(rid, arr);
      
      if (state.currentRoomId === rid) {
        appendMessage(msg);
        tryMarkRead(msg); 
      }
    });
    
    socket.on('check room', (id) => {
      log('ev', '⬅️ check room', { id });
      const me = users[activeUser];
      emit('join room', { room_id: id, row_id: me.row_id, to_name: peerNameFor(me.name), offset: 0, limit: 50 });
      el('joinRoomId').value = id;
    });

    // -------- Typing Events Logic --------
    // Assume backend routes `typing:start` and `typing:stop`
    socket.on('typing:start', (data) => {
       log('ev', '⬅️ typing:start', data);
       handleTypingEvent(data, true);
    });

    socket.on('typing:stop', (data) => {
       log('ev', '⬅️ typing:stop', data);
       handleTypingEvent(data, false);
    });

    socket.on('presence.updated', (p) => log('ev', '⬅️ presence.updated', p));
    socket.on('presence.result', (p) => log('ev', '⬅️ presence.result', p));
    socket.on('message.read', (p) => log('ev', '⬅️ message.read', p));
    socket.on('room.updated', (p) => log('ev', '⬅️ room.updated', p));
    socket.on('error', (e) => log('err', '❌ error', e));
  }

  function emit(ev, payload) {
    if(!socket || !socket.connected) {
       log('err', 'Cannot emit, socket disconnected', ev);
       return;
    }
    log('emit', '➡️ ' + ev, payload);
    socket.emit(ev, payload);
  }

  // ---------- Identity UI ----------
  function renderUserPills() {
    const box = el('userPills');
    box.innerHTML = '';
    Object.values(users).forEach(u => {
      const pill = document.createElement('button');
      pill.className = 'pill' + (u.name === activeUser ? ' active' : '');
      pill.textContent = u.name;
      pill.addEventListener('click', () => {
        activeUser = u.name;
        renderUserPills();
        el('rowId').value = users[activeUser].row_id;
        
        // Clear active room state when switching users to prevent confusion
        state.currentRoomId = null;
        el('activeRoomLabel').textContent = 'Select a room';
        el('messages').innerHTML = '<div style="text-align:center; color:var(--muted); margin-top:50px; font-size:0.9rem;">Join a room to start messaging</div>';
        el('msgInput').disabled = true;
        el('btnSendMsg').disabled = true;
        hideTyping();
      });
      box.appendChild(pill);
    });
    el('rowId').value = users[activeUser].row_id;

    // Peers dropdown
    const peerSel = el('peerSelect');
    peerSel.innerHTML = '';
    Object.values(users).forEach(u => {
      if (u.name === activeUser) return;
      const opt = document.createElement('option');
      opt.value = u.name;
      opt.textContent = u.name;
      peerSel.appendChild(opt);
    });

    // Add Custom option
    const optCustom = document.createElement('option');
    optCustom.value = 'CUSTOM';
    optCustom.textContent = '... Custom User ...';
    peerSel.appendChild(optCustom);
    
    peerSel.addEventListener('change', (e) => {
        el('customPeerFields').style.display = e.target.value === 'CUSTOM' ? 'flex' : 'none';
    });
  }

  function resetIds() {
    users.Athos.row_id = STATIC_IDS.Athos;
    users.Porthos.row_id = STATIC_IDS.Porthos;
    users.Aramis.row_id  = STATIC_IDS.Aramis;
    renderUserPills();
    log('sys', 'IDs resetted to defaults');
  }

  function peerNameFor(myName) {
    const sel = el('peerSelect').value;
    return sel || (myName === 'Athos' ? 'Porthos' : 'Athos');
  }

  // ---------- Rooms ----------
  function renderRooms(rooms) {
    state.rooms.clear();
    const list = el('roomsList');
    list.innerHTML = '';
    
    if(!rooms || rooms.length === 0) {
       list.innerHTML = '<div style="color:var(--muted); font-size:0.85rem; padding:10px;">No rooms found.</div>';
       return;
    }

    rooms.forEach(r => {
      const id = r.id || r.Id || r.room_id || r.RoomId;
      if (!id) return;
      state.rooms.set(id, r);
      
      const div = document.createElement('div');
      div.className = 'room' + (state.currentRoomId === id ? ' active' : '');
      const name = r.name || r.to_name || r.ToName || 'Unnamed Room';
      
      div.innerHTML = `
        <div class="name"># ${name}</div>
        <div class="id">${id}</div>
      `;
      div.addEventListener('click', () => joinRoom(id, name));
      list.appendChild(div);
    });
  }

  function joinRoom(roomId, label) {
    const me = users[activeUser];
    state.currentRoomId = roomId;
    el('activeRoomLabel').textContent = label ? `${label} (${roomId.split('-')[0]})` : roomId.split('-')[0];
    
    // Enable inputs
    el('msgInput').disabled = false;
    el('btnSendMsg').disabled = false;
    el('msgInput').focus();
    
    hideTyping(); // Clear any stale typing states
    state.typingUsers.clear(); // Reset typers
    
    const proj = el('projectId').value || 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa';
    emit('join room', { room_id: roomId, row_id: me.row_id, project_id: proj, to_name: label || '', offset: 0, limit: 100 });
    
    // UI update for room selection
    document.querySelectorAll('.room').forEach(r => r.classList.remove('active'));
    // Find and add active class to clicked room
    [...document.querySelectorAll('.room .id')].forEach(el => {
       if(el.textContent === roomId) el.parentElement.classList.add('active');
    });

    el('messages').innerHTML = '<div style="text-align:center; color:var(--muted); margin-top:50px;">Loading history...</div>';
  }

  // ---------- Chat ----------
  function renderMessages() {
    const box = el('messages');
    box.innerHTML = '';
    const rid = state.currentRoomId;
    if (!rid) return;
    
    const arr = state.messages.get(rid) || [];
    if(arr.length === 0) {
       box.innerHTML = '<div style="text-align:center; color:var(--muted); margin-top:50px;">No messages yet. Say hi!</div>';
       return;
    }
    
    arr.forEach(msg => appendMessage(msg));
    box.scrollTop = box.scrollHeight;
  }

  function appendMessage(msg) {
    const box = el('messages');
    
    // Remove "no messages" or "Loading history" text if it exists
    if(box.innerHTML.includes('No messages yet') || box.innerHTML.includes('Loading history')) box.innerHTML = '';
    
    const div = document.createElement('div');
    const me = users[activeUser] || { name: 'Unknown', row_id: '' };

    const from = msg.from || msg.From || '';
    const mid  = msg.id || msg.Id || msg.message_id || msg.MessageId;
    const mine = (from === me.name) || (from === me.row_id);
    
    let createdDate = 'Just now';
    if(msg.created_at || msg.CreatedAt) {
       createdDate = new Date(msg.created_at || msg.CreatedAt).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }
    
    const body = escapeHtml(msg.message || msg.Message || msg.content || msg.Content || '');

    div.className = 'msg' + (mine ? ' mine' : '');
    div.innerHTML = `
      <div class="meta">
        <strong style="color: ${mine ? '#22d3ee' : '#cbd5e1'}">${mine ? 'You' : (from || 'Unknown')}</strong>
        <span style="opacity:0.7">${createdDate}</span>
        ${mid ? `<span class="mid" title="${mid}">#${mid.substring(0,8)}</span>` : ''}
        ${!mine && mid ? `<button class="readpill" data-mid="${mid}" title="Mark as Read">✓</button>` : ''}
      </div>
      <div class="body">${body}</div>
    `;
    
    const btn = div.querySelector('button[data-mid]');
    if (btn && mid) btn.addEventListener('click', () => {
        markRead(mid);
        btn.style.color = 'var(--success)';
        btn.textContent = '✓✓';
    });

    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ---------- Read Logic ----------
  function markRead(messageId) {
    const me = users[activeUser];
    if (!messageId || state.readSent.has(messageId)) return;
    
    const rid = state.currentRoomId;
    if (!rid) return;

    state.readSent.add(messageId);
    emit('message:read', { row_id: me.row_id, room_id: rid });
  }
  
  function tryMarkRead(msg) {
    const me = users[activeUser];
    const from = msg.from || msg.From || '';
    if ((from === me.name) || (from === me.row_id)) return; // Don't mark own messages
    
    const mid = msg?.id || msg?.Id || msg?.message_id || msg?.MessageId;
    if (!mid) return;
    markRead(mid);
  }
  
  function markAllVisibleAsRead() {
    const rid = state.currentRoomId;
    if (!rid) return;
    const arr = state.messages.get(rid) || [];
    arr.forEach(tryMarkRead);
  }

  // ---------- Actions ----------
  function doConnected() {
    const me = users[activeUser];
    const proj = el('projectId').value || 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa';
    emit('connected', { row_id: me.row_id, project_id: proj, offset: 0, limit: 50 });
    
    // heartbeat every 30s
    if (!heartbeatTimer) {
      heartbeatTimer = setInterval(() => {
        emit('presence:ping', { row_id: me.row_id, project_id: proj });
      }, 30000);
      log('sys', 'Presence heartbeat started (30s interval)');
    }
  }

  function pullRooms() {
    const me = users[activeUser];
    const proj = el('projectId').value || 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa';
    emit('rooms list', { row_id: me.row_id, project_id: proj, offset: 0, limit: 50 });
  }

  function createDM() {
    const me = users[activeUser];
    const peerName = el('peerSelect').value;
    const proj = el('projectId').value || 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa';
    
    let toName = '';
    let toRowId = '';

    if (peerName === 'CUSTOM') {
       toName = el('customPeerName').value.trim();
       toRowId = el('customPeerId').value.trim();
       if (!toName || !toRowId) { alert("Please enter custom peer name and valid UUID"); return; }
    } else {
       const peer = users[peerName];
       toName = peer.name;
       toRowId = peer.row_id;
    }

    emit('create room', {
      row_id: me.row_id,
      project_id: proj,
      type: 'single',
      to_row_id: toRowId,
      to_name: toName,
      from_name: me.name
    });
  }

  function createStaticGroup() {
    const proj = el('projectId').value || '7380859b-8dac-4fe3-b7aa-1fdfcdb4f5c1';
    emit('create room', {
      "name": "",
      "type": "group",
      "row_id": "0102f522-6372-41e2-89b7-109a3d3a0a3b",
      "item_id": "2cebed90-9fc3-4e90-82e6-11727762dfc5",
      "from_name": "asdfasdfAA!1",
      "project_id": proj,
      "to_name": "#23452345234"
    });
  }

  function sendMsg() {
    const rid = state.currentRoomId || el('joinRoomId').value.trim();
    const me  = users[activeUser];
    const text = el('msgInput').value.trim();
    
    if (!rid) { alert('Join a room first'); return; }
    if (!text) return;

    const proj = el('projectId').value || 'aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa';

    // Send chat message
    emit('chat message', {
      room_id: rid,
      project_id: proj,
      from: me.name,
      author_row_id: me.row_id,
      content: text,
      type: 'text',
      file: '',
      parent_id: null
    });
    
    el('msgInput').value = '';
    
    // Stop typing indicator when message is sent
    clearTimeout(typingTimer);
    if(isTyping) {
       isTyping = false;
       emit('typing:stop', { room_id: rid, user_name: me.name });
    }
  }

  function joinRoomByInput() {
    const rid = el('joinRoomId').value.trim();
    if (!rid) return;
    joinRoom(rid, 'Manual Join');
  }

  function markReadManual() {
    const mid = el('manualMsgId').value.trim();
    if (!mid) return;
    markRead(mid);
    el('manualMsgId').value = '';
    log('sys', `Manual marked read: ${mid}`);
  }

  // ---------- TYPING INDICATOR LOGIC ----------
  
  let typingTimer;
  const TYPING_DELAY = 1500; // 1.5 seconds delay
  let isTyping = false;

  // Listen to input changes
  el('msgInput').addEventListener('input', () => {
    const rid = state.currentRoomId;
    if (!rid) return;
    
    const me = users[activeUser];

    // Emit start if we weren't typing
    if (!isTyping) {
        isTyping = true;
        // Broadcasts to others in the room
        emit('typing:start', { room_id: rid, user_name: me.name });
    }

    // Reset the timer
    clearTimeout(typingTimer);
    
    // Set timer to stop typing
    typingTimer = setTimeout(() => {
        isTyping = false;
        emit('typing:stop', { room_id: rid, user_name: me.name });
    }, TYPING_DELAY);
  });
  
  // Submit on Enter key
  el('msgInput').addEventListener('keydown', (e) => {
     if(e.key === 'Enter') {
         e.preventDefault();
         sendMsg();
     }
  });

  // Allow custom Row ID edit
  el('rowId').addEventListener('input', (e) => {
     if(users[activeUser]) {
         users[activeUser].row_id = e.target.value.trim();
     }
  });

  // Handle incoming typing events
  function handleTypingEvent(data, isStart) {
     if (!data || !data.room_id) return;
     
     // Only show if it's the current room and not our own event
     if (data.room_id === state.currentRoomId && data.user_name !== activeUser) {
         if (isStart) {
             state.typingUsers.add(data.user_name);
         } else {
             state.typingUsers.delete(data.user_name);
         }
         updateTypingUI();
     }
  }

  function updateTypingUI() {
     const ind = el('typingIndicator');
     if (state.typingUsers.size > 0) {
         const usersArr = Array.from(state.typingUsers);
         let text = usersArr[0];
         if (usersArr.length === 2) text = `${usersArr[0]} and ${usersArr[1]}`;
         else if (usersArr.length > 2) text = 'Multiple people';
         
         el('typingUser').textContent = text;
         ind.style.display = 'block';
         
         // Scroll to bottom so typing indicator is visible
         const msgs = el('messages');
         msgs.scrollTop = msgs.scrollHeight;
     } else {
         hideTyping();
     }
  }

  function hideTyping() {
     el('typingIndicator').style.display = 'none';
  }

  // ---------- Bind Events ----------
  el('btnOpenConfig').addEventListener('click', () => {
      el('configDrawer').classList.add('open');
      el('drawerOverlay').classList.add('open');
  });
  el('btnCloseConfig').addEventListener('click', () => {
      el('configDrawer').classList.remove('open');
      el('drawerOverlay').classList.remove('open');
  });
  el('drawerOverlay').addEventListener('click', () => {
      el('configDrawer').classList.remove('open');
      el('drawerOverlay').classList.remove('open');
  });

  el('btnConnect').addEventListener('click', connect);
  el('btnConnected').addEventListener('click', doConnected);
  el('btnRoomsList').addEventListener('click', pullRooms);
  el('btnCreateDM').addEventListener('click', createDM);
  el('btnCreateStaticGroup').addEventListener('click', createStaticGroup);
  el('btnSendMsg').addEventListener('click', sendMsg);
  el('btnJoinRoom').addEventListener('click', joinRoomByInput);
  el('btnMarkRead').addEventListener('click', markReadManual);
  el('btnResetIds').addEventListener('click', resetIds);
  el('btnAddUser').addEventListener('click', () => {
     let name = el('newUserName').value.trim();
     if (!name) { alert("Please enter a name"); return; }
     let rid = el('newUserRowId').value.trim();
     if (!rid) rid = crypto.randomUUID();
     
     users[name] = { name: name, row_id: rid };
     activeUser = name;
     
     el('newUserName').value = '';
     el('newUserRowId').value = '';
     el('rowId').value = rid;
     
     renderUserPills();
     
     state.currentRoomId = null;
     el('activeRoomLabel').textContent = 'Select a room';
     el('messages').innerHTML = '<div style="text-align:center; color:var(--muted); margin-top:50px; font-size:0.9rem;">Join a room to start messaging</div>';
     el('msgInput').disabled = true;
     el('btnSendMsg').disabled = true;
     hideTyping();
     
     log('sys', `Manual user '${name}' added and selected.`);
  });

  // Boot
  (function boot() {
    renderUserPills();
  })();

  // Re-mark visible messages when tab becomes visible
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) markAllVisibleAsRead();
  });
</script>
</body>
</html>
